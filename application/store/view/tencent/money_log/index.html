<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <form id="edit-form" class="form-commonsearch" role="form" data-toggle="validator" method="POST" action="">
                        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
                            <div class="row">
                                <div style="width: 100%;display: flex;">
                                    <div class="col-xs-4 col-sm-4 col-md-4">
                                        <div class="form-group">
                                            <label class="control-label">日期筛选</label>
                                            <div>
                                                <input type="text" class="form-control datetimerange" id="dateRange" data-locale='{"format":"YYYY-MM-DD"}' placeholder="指定日期" value="" />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="col-xs-4 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">金额</label>
                                            <div>
                                                <input class="form-control" id="money" type="text" name="money" placeholder="请输入金额" value=""/>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="col-xs-4 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">广告账户ID</label>
                                            <div>
                                                <select name="account_id" class="form-control selectpicker" data-live-search="true" data-none-selected-text="请选择">
                                                    <option value="">请选择</option>
                                                    {foreach $account_data as $vo}
                                                    <option value="{$vo.account_id}">{$vo.account_id}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="col-xs-4 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">子钱包ID</label>
                                            <div>
                                                <select name="sub_wallet_id" class="form-control selectpicker" data-live-search="true" data-none-selected-text="请选择">
                                                    <option value="">请选择</option>
                                                    {foreach $account_wallet_data as $vo}
                                                    <option value="{$vo.sub_wallet_id}">{$vo.sub_wallet_id}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-6 col-sm-6 col-md-3">
                                    <div class="form-group">
                                        <label class="control-label"></label>
                                        <div class="row">
                                            <div class="col-xs-3">
                                                <input type="button" id="tj" class="btn btn-success btn-block" value="提交"/>
                                            </div>
                                            <div class="col-xs-3">
                                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" id="shuaxin" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                    </div>

                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // 获取当前日期
    const today = new Date();

    // 计算30天前的日期
    const sevenDaysAgo = new Date(today);
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 30);

    // 格式化日期为"YYYY-MM-DD"格式
    const formattedToday = today.toISOString().split('T')[0];
    const formattedSevenDaysAgo = sevenDaysAgo.toISOString().split('T')[0];

    // 设置输入框的默认值
    document.getElementById('dateRange').value = `${formattedSevenDaysAgo} - ${formattedToday}`;
    
    document.getElementById('tj').addEventListener('click', function(event) {
        document.getElementById('shuaxin').click()
    })
</script>
