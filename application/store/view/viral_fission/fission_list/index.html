<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div class="alert alert-warning alert-dismissable">
            <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
            <strong>提示：</strong>内容由AI生成，仅供参考。使用时请严格遵守相关法律规定对内容进行标识，并仅限本平台及关联平台内按授权要求使用。
        </div>
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row">
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">千川ID</label>
                        <input class="operate" type="hidden" data-name="adv_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="adv_id" placeholder="请输入千川ID" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">原素材ID</label>
                        <input class="operate" type="hidden" data-name="old_material_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="old_material_id" placeholder="请输入原素材ID"
                                   value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">素材标题</label>
                        <input class="operate" type="hidden" data-name="title" value="LIKE"/>
                        <div>
                            <input class="form-control" type="text" name="title" placeholder="请输入素材标题" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-8 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div>
                            <button type="submit" class="btn btn-success btn-block">搜索</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>

<!-- 投前检测确认模态框 -->
<div class="modal fade" id="preCheckConfirmModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title">确认投前检测</h4>
            </div>
            <div class="modal-body">
                <p>确定要对选中的裂变素材进行投前检测吗？</p>
                <p class="text-muted">检测将对接API，生成任务，监听返回结果。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-warning" id="confirmPreCheck">确定</button>
            </div>
        </div>
    </div>
</div>

<!-- 采纳确认模态框 -->
<div class="modal fade" id="adoptConfirmModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title">确认采纳</h4>
            </div>
            <div class="modal-body">
                <p>是否不进行投前检测，直接生成？</p>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="skipCheck" value="1"> 跳过投前检测
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" id="confirmAdopt">确定</button>
            </div>
        </div>
    </div>
</div>
