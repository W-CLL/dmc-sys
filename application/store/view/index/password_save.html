<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
    }

    .form-container {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
        text-align: center;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        float: left;
        line-height: 36px;
    }

    .form-group input {

        padding: 10px;
        border-radius: 3px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .submit-btn {
        padding: 10px 20px;
        background-color: #444c69;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background-color: #444c69;
    }
</style>

<div class="form-container">

    <form  role="form" data-toggle="validator" method="POST" action="">
        <div class="form-group">
            <label for="input1">旧密码：</label>
            <input type="password" id="input1" name="passwords" required>
        </div>
        <div class="form-group">
            <label for="input2">新密码：</label>
            <input type="password" id="input2" name="password" required>
        </div>

    </form>
</div>
