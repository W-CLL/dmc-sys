<form id="upload-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="" enctype="multipart/form-data">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回单图片:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="file-upload-wrapper">
                <div class="file-upload-box">
                    <input type="file" class="file-input" name="image" accept="image/jpeg,image/png,image/gif" id="image-upload" data-rule="required">
                    <div class="file-upload-label">
                        <i class="fa fa-cloud-upload fa-2x"></i>
                        <p class="file-upload-text">点击选择图片</p>
                        <p class="file-upload-hint">支持 JPG、PNG、GIF 格式，大小不超过 5MB</p>
                    </div>
                </div>
                <div class="file-info" id="file-info" style="display: none;">
                    <span class="file-name"></span>
                    <span class="file-size"></span>
                </div>
                <!-- 图片预览区域 -->
                <div class="image-preview" id="image-preview" style="display: none; margin-top: 15px; text-align: center;">
                    <img id="preview-image" src="" alt="预览图片" style="max-width: 100%; max-height: 200px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border: 1px solid #ddd;">
                </div>
            </div>
            <div class="help-block">支持JPG、PNG、GIF格式的图片</div>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="button" id="submit-btn" class="btn btn-success btn-embossed">上传并识别</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    // 使用原生JavaScript重写文件上传功能，避免jQuery依赖问题
    document.addEventListener('DOMContentLoaded', function() {
        // 文件上传美化交互
        var uploadBox = document.querySelector('.file-upload-box');
        var fileInput = document.querySelector('.file-input');
        var fileInfo = document.getElementById('file-info');
        var fileName = document.querySelector('.file-name');
        var fileSize = document.querySelector('.file-size');
        
        // 文件选择事件
        if (fileInput) {
            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (file) {
                    updateFileInfo(file);
                } else {
                    // 文件被清除时的处理
                    clearFileInfo();
                }
            });
        }
        
        // 点击上传区域时触发文件选择
        if (uploadBox) {
            uploadBox.addEventListener('click', function(e) {
                // 防止事件冒泡
                e.stopPropagation();
                // 触发文件输入框
                fileInput.click();
            });
        }
        
        // 防止点击文件输入框时重复触发点击事件
        if (fileInput) {
            fileInput.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
        
        // 更新文件信息显示
        function updateFileInfo(file) {
            if (file) {
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.style.display = 'flex';
                
                // 添加图片预览功能
                if (file.type.startsWith('image/')) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var previewImage = document.getElementById('preview-image');
                        previewImage.src = e.target.result;
                        document.getElementById('image-preview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            } else {
                clearFileInfo();
            }
        }
        
        // 清除文件信息显示
        function clearFileInfo() {
            fileInfo.style.display = 'none';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('preview-image').src = '';
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            var k = 1024;
            var sizes = ['Bytes', 'KB', 'MB', 'GB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 表单提交前确保使用正确的enctype
        var form = document.getElementById('upload-form');
        var submitBtn = document.getElementById('submit-btn');
        
        if (form && submitBtn) {
            // 确保表单使用正确的enctype
            form.setAttribute('enctype', 'multipart/form-data');
            
            // 标记是否已经提交过表单
            var formSubmitted = false;
            
            // 监听提交按钮点击事件
            submitBtn.addEventListener('click', function(e) {
                // 如果已经提交过，则阻止再次提交
                if (formSubmitted) {
                    e.preventDefault();
                    return false;
                }
                
                // 检查是否选择了文件
                if (fileInput && fileInput.files.length === 0) {
                    if (typeof Toastr !== 'undefined') {
                        Toastr.error("请选择要上传的回单图片");
                    } else {
                        alert("请选择要上传的回单图片");
                    }
                    return false;
                }
                
                // 标记表单已提交
                formSubmitted = true;
                submitBtn.disabled = true;
                submitBtn.textContent = '上传中...';
                
                // 使用FormData处理包含文件的表单
                var formData = new FormData(form);
                
                // 使用原生XMLHttpRequest提交表单
                var xhr = new XMLHttpRequest();
                xhr.open('POST', form.action || window.location.href, true);
                
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                var ret = JSON.parse(xhr.responseText);
                                if (ret.code === 1) {
                                    // 成功处理
                                    if (typeof Toastr !== 'undefined') {
                                        Toastr.success(ret.msg || "上传成功");
                                    } else {
                                        alert(ret.msg || "上传成功");
                                    }
                                    setTimeout(function() {
                                        // 关闭弹窗或跳转
                                        if (typeof parent !== 'undefined' && parent.layer) {
                                            parent.$("#table").bootstrapTable('refresh');
                                            parent.layer.closeAll();
                                        } else {
                                            window.location.href = ret.url || history.back();
                                        }
                                    }, 1500);
                                } else {
                                    // 错误处理 - 显示具体的错误信息
                                    var errorMsg = ret.msg || "上传失败";
                                    if (typeof Toastr !== 'undefined') {
                                        Toastr.error(errorMsg);
                                    } else {
                                        alert(errorMsg);
                                    }
                                    // 重置提交状态，允许重新提交
                                    formSubmitted = false;
                                    submitBtn.disabled = false;
                                    submitBtn.textContent = '上传并识别';
                                }
                            } catch (e) {
                                // 解析失败 - 显示更友好的错误信息
                                console.error("响应解析失败详情:", e);
                                console.error("原始响应:", xhr.responseText);
                                
                                // 尝试解析可能的错误信息
                                var errorMsg = "服务器响应格式错误，请联系管理员";
                                try {
                                    var errorResponse = JSON.parse(xhr.responseText);
                                    if (errorResponse && errorResponse.msg) {
                                        errorMsg = errorResponse.msg;
                                    }
                                } catch (parseError) {
                                    // 检查响应内容是否包含错误信息
                                    var responseText = xhr.responseText;
                                    if (responseText.indexOf('识别失败：文件下载失败') !== -1) {
                                        errorMsg = "识别失败：文件下载失败";
                                    }
                                }
                                
                                if (typeof Toastr !== 'undefined') {
                                    Toastr.error(errorMsg);
                                } else {
                                    alert(errorMsg);
                                }
                                
                                // 重置提交状态，允许重新提交
                                formSubmitted = false;
                                submitBtn.disabled = false;
                                submitBtn.textContent = '上传并识别';
                            }
                        } else {
                            // 请求失败
                            var errorMsg = "请求失败，状态码: " + xhr.status + " " + xhr.statusText;
                            if (typeof Toastr !== 'undefined') {
                                Toastr.error(errorMsg);
                            } else {
                                alert(errorMsg);
                            }
                            // 重置提交状态，允许重新提交
                            formSubmitted = false;
                            submitBtn.disabled = false;
                            submitBtn.textContent = '上传并识别';
                        }
                    }
                };
                
                xhr.onerror = function() {
                    // 网络错误处理
                    if (typeof Toastr !== 'undefined') {
                        Toastr.error("网络连接错误，请检查网络后重试");
                    } else {
                        alert("网络连接错误，请检查网络后重试");
                    }
                    // 重置提交状态，允许重新提交
                    formSubmitted = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '上传并识别';
                };
                
                xhr.send(formData);
            });
        }
    });
</script>

<style>
    .help-block {
        color: #999;
        font-size: 12px;
        margin-top: 5px;
    }
    
    /* 文件上传美化样式 */
    .file-upload-wrapper {
        position: relative;
    }

    .file-upload-box {
        border: 2px dashed #ced4da;
        border-radius: 6px;
        padding: 30px 15px;
        text-align: center;
        background-color: #fafafa;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .file-upload-box:hover {
        border-color: #409eff;
        background-color: #f0f8ff;
    }

    .file-input {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        opacity: 0;
        cursor: pointer;
    }

    .file-upload-label {
        pointer-events: none;
    }

    .file-upload-label i {
        color: #6c757d;
        margin-bottom: 10px;
    }

    .file-upload-text {
        margin: 0;
        font-size: 16px;
        color: #495057;
        font-weight: 500;
    }

    .file-upload-hint {
        margin: 5px 0 0;
        font-size: 12px;
        color: #6c757d;
    }

    .file-info {
        margin-top: 10px;
        padding: 10px;
        background-color: #e9f5ff;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .file-name {
        font-weight: 500;
        color: #212529;
        word-break: break-all;
    }

    .file-size {
        font-size: 12px;
        color: #6c757d;
        white-space: nowrap;
        margin-left: 10px;
    }

    /* 图片预览样式 */
    .image-preview {
        text-align: center;
        padding: 10px 0;
    }

    .image-preview img {
        max-width: 100%;
        max-height: 200px;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        border: 1px solid #ddd;
    }
</style>
