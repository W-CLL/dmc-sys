<form id="upload-form" class="form-horizontal" role="form" method="POST" action="" enctype="multipart/form-data">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回单图片:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="file-upload-wrapper">
                <div class="file-upload-box">
                    <input type="file" class="file-input" name="image" accept="image/jpeg,image/png,image/gif" id="image-upload">
                    <div class="file-upload-label">
                        <i class="fa fa-cloud-upload fa-2x"></i>
                        <p class="file-upload-text">点击选择图片</p>
                        <p class="file-upload-hint">支持 JPG、PNG、GIF 格式，大小不超过 5MB</p>
                    </div>
                </div>
                <div class="file-info" id="file-info" style="display: none;">
                    <span class="file-name"></span>
                    <span class="file-size"></span>
                </div>
                <!-- 图片预览区域 -->
                <div class="image-preview" id="image-preview" style="display: none; margin-top: 15px; text-align: center;">
                    <img id="preview-image" src="" alt="预览图片" style="max-width: 100%; max-height: 200px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border: 1px solid #ddd;">
                </div>
            </div>
            <div class="help-block">支持JPG、PNG、GIF格式的图片</div>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">上传并识别</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    // 使用原生JavaScript实现文件上传交互，避免依赖require函数
    document.addEventListener('DOMContentLoaded', function() {
        // 文件上传美化交互
        var uploadBox = document.querySelector('.file-upload-box');
        var fileInput = document.querySelector('.file-input');
        
        // 点击上传区域时触发文件选择
        if (uploadBox) {
            uploadBox.addEventListener('click', function(e) {
                // 防止事件冒泡
                e.stopPropagation();
                // 触发文件输入框
                fileInput.click();
            });
        }
        
        // 防止点击文件输入框时重复触发点击事件
        if (fileInput) {
            fileInput.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
        
        // 文件选择事件
        if (fileInput) {
            fileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (file) {
                    // 更新文件信息显示
                    var fileInfo = document.getElementById('file-info');
                    var fileName = document.querySelector('.file-name');
                    var fileSize = document.querySelector('.file-size');
                    
                    if (fileInfo && fileName && fileSize) {
                        fileName.textContent = file.name;
                        
                        // 格式化文件大小
                        var k = 1024;
                        var sizes = ['Bytes', 'KB', 'MB', 'GB'];
                        var i = Math.floor(Math.log(file.size) / Math.log(k));
                        fileSize.textContent = parseFloat((file.size / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                        
                        fileInfo.style.display = 'flex';
                        
                        // 添加图片预览功能
                        if (file.type.startsWith('image/')) {
                            var reader = new FileReader();
                            reader.onload = function(e) {
                                var previewImage = document.getElementById('preview-image');
                                if (previewImage) {
                                    previewImage.src = e.target.result;
                                    document.getElementById('image-preview').style.display = 'block';
                                }
                            };
                            reader.readAsDataURL(file);
                        }
                    }
                } else {
                    // 清除文件信息显示
                    var fileInfo = document.getElementById('file-info');
                    if (fileInfo) {
                        fileInfo.style.display = 'none';
                        document.getElementById('image-preview').style.display = 'none';
                        document.getElementById('preview-image').src = '';
                    }
                }
            });
        }
    });
</script>

<style>
    .help-block {
        color: #999;
        font-size: 12px;
        margin-top: 5px;
    }
    
    /* 文件上传美化样式 */
    .file-upload-wrapper {
        position: relative;
    }

    .file-upload-box {
        border: 2px dashed #ced4da;
        border-radius: 6px;
        padding: 30px 15px;
        text-align: center;
        background-color: #fafafa;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .file-upload-box:hover {
        border-color: #409eff;
        background-color: #f0f8ff;
    }

    .file-input {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        opacity: 0;
        cursor: pointer;
    }

    .file-upload-label {
        pointer-events: none;
    }

    .file-upload-label i {
        color: #6c757d;
        margin-bottom: 10px;
    }

    .file-upload-text {
        margin: 0;
        font-size: 16px;
        color: #495057;
        font-weight: 500;
    }

    .file-upload-hint {
        margin: 5px 0 0;
        font-size: 12px;
        color: #6c757d;
    }

    .file-info {
        margin-top: 10px;
        padding: 10px;
        background-color: #e9f5ff;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .file-name {
        font-weight: 500;
        color: #212529;
        word-break: break-all;
    }

    .file-size {
        font-size: 12px;
        color: #6c757d;
        white-space: nowrap;
        margin-left: 10px;
    }

    /* 图片预览样式 */
    .image-preview {
        text-align: center;
        padding: 10px 0;
    }

    .image-preview img {
        max-width: 100%;
        max-height: 200px;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        border: 1px solid #ddd;
    }
</style>
