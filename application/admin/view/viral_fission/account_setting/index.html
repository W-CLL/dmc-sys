<style>
    /* 确保容器宽度足够 */
    .fission-strategies-container {
        width: 100%;
        word-wrap: break-word;
    }

    /* 调整文本换行 */
    .fission-strategies-text {
        white-space: normal;
    }

</style>
<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                        <a href="javascript:;" class="btn btn-primary btn-batch-setting btn-disabled disabled"
                           title="批量设置">批量设置(<span id="select_total">0</span>)</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('viral_fission/account_setting/setting')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row">
                <div class="col-xs-8 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">账户名称</label>
                        <input class="operate" type="hidden" data-name="name" value="LIKE"/>
                        <div>
                            <input class="form-control" type="text" name="name" placeholder="请输入账户名称" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-8 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">账户ID</label>
                        <input class="operate" type="hidden" data-name="advertiser_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="advertiser_id" placeholder="请输入账户ID"
                                   value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-8 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">公司名</label>
                        <input class="operate" type="hidden" data-name="company.company_name" value="LIKE"/>
                        <div>
                            <input class="form-control" type="text" name="company.company_name"
                                   placeholder="请输入公司名" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-8 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div>
                            <button type="submit" class="btn btn-success btn-block">搜索</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
