<link rel="stylesheet" href="/assets/css/viral_fission_compact.css">
<style>
    .fission-status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
    }

    .status-pending { background: #f8f9fa; color: #6c757d; border: 1px solid #dee2e6; }
    .status-processing { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
    .status-success { background: #e8f5e8; color: #2e7d32; border: 1px solid #c8e6c8; }
    .status-failed { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    .enhanced-toolbar {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 15px;
        border: 1px solid #e9ecef;
    }

    .video-preview {
        width: 60px;
        height: 40px;
        object-fit: cover;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid #dee2e6;
    }

    .progress-indicator {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }

    .progress-bar-custom {
        flex: 1;
        height: 6px;
        background: #e9ecef;
        border-radius: 3px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #007bff, #28a745);
        transition: width 0.3s ease;
    }

    .batch-actions-panel {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 15px;
        display: none;
    }

    .batch-actions-panel.show {
        display: block;
    }



    .progress-bar-mini {
        width: 60px;
        height: 4px;
        background: #e9ecef;
        border-radius: 2px;
        overflow: hidden;
        display: inline-block;
        margin-left: 5px;
        vertical-align: middle;
    }

    .enhanced-toolbar {
        padding: 10px 15px;
    }

    /* 随机状态样式 */
    .status-random {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 500;
    }

    .status-processing { background: #e3f2fd; color: #1976d2; }
    .status-waiting { background: #fff3e0; color: #f57c00; }
    .status-analyzing { background: #f3e5f5; color: #7b1fa2; }
    .status-optimizing { background: #e8f5e8; color: #388e3c; }
    .status-reviewing { background: #fce4ec; color: #c2185b; }

    /* 紧凑搜索表单样式 */
    .form-commonsearch .form-group {
        margin-bottom: 10px;
    }

    .form-commonsearch .control-label {
        font-size: 13px;
        font-weight: 500;
        color: #333333 !important;
        margin-bottom: 5px;
        display: block;
        white-space: nowrap;
        overflow: visible;
    }

    .form-commonsearch .form-control.input-sm {
        height: 32px;
        padding: 6px 10px;
        font-size: 13px;
        border-radius: 3px;
        border: 1px solid #ced4da;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        width: 100%;
        box-sizing: border-box;
    }

    .form-commonsearch select.form-control {
        padding-right: 25px;
        background-position: right 8px center;
        background-size: 12px;
        min-width: 120px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        height: 32px;
        padding: 6px 10px;
        font-size: 13px;
    }

    .form-commonsearch select.form-control option {
        padding: 5px 10px;
        font-size: 13px;
    }

    .form-commonsearch .form-control.input-sm:focus {
        border-color: #80bdff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .form-commonsearch .input-group-sm .input-group-addon {
        padding: 6px 8px;
        font-size: 13px;
        line-height: 1.5;
        border-radius: 3px;
    }

    .form-commonsearch .btn-sm {
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.5;
        border-radius: 3px;
        height: 32px;
    }

    .form-commonsearch .row {
        margin-left: -8px;
        margin-right: -8px;
    }

    .form-commonsearch .row > [class*="col-"] {
        padding-left: 8px;
        padding-right: 8px;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
        .stats-cards {
            flex-direction: column;
        }

        .stats-card {
            min-width: unset;
        }

        .batch-actions-panel .pull-right {
            float: none !important;
            margin-top: 10px;
        }

        .toolbar .form-group {
            margin-bottom: 10px;
        }
    }

    .datetimerange {
        width: 100% !important;
        box-sizing: border-box;
    }

    /* Tab导航样式 */
    .nav-tabs {
        border-bottom: 2px solid #e9ecef;
    }

    .nav-tabs > li > a {
        color: #6c757d;
        border: none;
        border-radius: 0;
        padding: 12px 20px;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .nav-tabs > li > a:hover {
        background-color: #f8f9fa;
        border: none;
        color: #495057;
    }

    .nav-tabs > li.active > a,
    .nav-tabs > li.active > a:hover,
    .nav-tabs > li.active > a:focus {
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px 4px 0 0;
    }

    .tab-link {
        text-decoration: none !important;
    }

    /* 图表样式 */
    .chart-container {
        background: white;
        border: 1px solid #e9ecef;
        border-radius: 6px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .chart-header {
        background: #f8f9fa;
        padding: 15px;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chart-content {
        padding: 20px;
        min-height: 400px;
    }

    .chart-filters {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    .chart-filters .form-control {
        width: auto;
        min-width: 120px;
    }

    .chart-row {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
    }

    .chart-col-8 {
        flex: 0 0 66.666667%;
    }

    .chart-col-4 {
        flex: 0 0 33.333333%;
    }

    @media (max-width: 768px) {
        .chart-row {
            flex-direction: column;
        }

        .chart-col-8, .chart-col-4 {
            flex: 1;
        }

        .chart-filters {
            flex-direction: column;
            align-items: stretch;
        }

        .chart-filters .form-control {
            width: 100%;
        }
    }

</style>

<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <!-- Tab导航 -->
        <ul class="nav nav-tabs" role="tablist" style="margin-bottom: 20px;">
            <li role="presentation" class="active">
                <a href="#list" aria-controls="list" role="tab" data-toggle="tab">
                    <i class="fa fa-list"></i> 素材列表
                </a>
            </li>
            <li role="presentation">
                <a href="{:url('viral_fission/material_consumption/dashboard')}" class="tab-link">
                    <i class="fa fa-dashboard"></i> 数据看板
                </a>
            </li>
        </ul>

        <!-- Tab内容 -->
        <div class="tab-content">
            <div role="tabpanel" class="tab-pane fade active in" id="list">

                <!-- 批量操作面板 - 紧凑版 -->
                <div class="batch-actions-panel" id="batch-actions-panel">
                    <div class="d-flex align-items-center flex-wrap">
                        <div class="btn-group btn-group-sm me-3 mb-2">
                            <button type="button" class="btn btn-success" id="btn-batch-generate">
                                <i class="fa fa-magic"></i> 生成
                            </button>
                            <button type="button" class="btn btn-primary" id="btn-batch-adopt">
                                <i class="fa fa-check"></i> 采纳
                            </button>
                            <button type="button" class="btn btn-warning" id="btn-batch-check">
                                <i class="fa fa-shield"></i> 检测
                            </button>
                        </div>
                        <span class="text-muted me-3 mb-2">
                            已选 <span id="selected-count">0</span> 项
                        </span>
                        <button type="button" class="btn btn-default btn-xs me-3 mb-2" id="btn-cancel-batch">
                            <i class="fa fa-times"></i> 清除
                        </button>
                        <div class="ms-auto d-flex align-items-center mb-2">
                            <small class="text-muted me-2">进度: <span id="progress-text">0%</span></small>
                            <div class="progress-bar-mini">
                                <div class="progress-fill" id="batch-progress" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="myTabContent" class="tab-content">
                    <div class="tab-pane fade active in" id="one">
                        <div class="widget-body no-padding">
                            <div id="toolbar" class="toolbar">
                                {:build_toolbar('refresh')}
                            </div>
                            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                                   width="100%">
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:4px;margin-bottom:10px;background:#f8f9fa;padding:15px 20px;border:1px solid #e9ecef;">
            <!-- 第一行 -->
            <div class="row" style="margin-bottom:12px;">
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">金额筛选</label>
                        <div class="input-group input-group-sm">
                            <input type="number" class="form-control" name="min_cost" placeholder="最小金额" step="0.01">
                            <span class="input-group-addon">-</span>
                            <input type="number" class="form-control" name="max_cost" placeholder="最大金额" step="0.01">
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">千川ID</label>
                        <input class="form-control input-sm" type="text" name="qc_id" placeholder="请输入千川ID" value=""/>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">公司名</label>
                        <input class="form-control input-sm" type="text" name="company_name" placeholder="请输入公司名" value=""/>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">负责人</label>
                        <input class="form-control input-sm" type="text" name="kahuna" placeholder="请输入负责人" value=""/>
                    </div>
                </div>
            </div>

            <!-- 第二行 -->
            <div class="row">
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="control-label">是否裂变素材</label>
                        <select class="form-control" name="is_generated">
                            <option value="">全部</option>
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="control-label">时间筛选</label>
                        <input type="text" class="form-control input-sm datetimerange" name="daterange" placeholder="选择时间范围">
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="control-label" style="visibility:hidden;">操作</label>
                        <button type="submit" id="tj" class="btn btn-success btn-sm btn-block">
                            <i class="fa fa-search"></i> 搜索
                        </button>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="control-label" style="visibility:hidden;">重置</label>
                        <button type="reset" class="btn btn-default btn-sm btn-block">
                            <i class="fa fa-refresh"></i> 重置
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
