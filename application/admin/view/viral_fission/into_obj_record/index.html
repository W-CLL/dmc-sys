<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row">
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">广告主ID</label>
                        <input class="operate" type="hidden" data-name="adv_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="adv_id" placeholder="请输入广告主ID" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">计划ID</label>
                        <input class="operate" type="hidden" data-name="obj_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="obj_id" placeholder="请输入计划ID" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">商品ID</label>
                        <input class="operate" type="hidden" data-name="product_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="product_id" placeholder="请输入商品ID" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">状态</label>
                        <input class="operate" type="hidden" data-name="status" value="="/>
                        <div>
                            <select name="status" class="form-control">
                                <option value="">全部</option>
                                <option value="success">成功</option>
                                <option value="failed">失败</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">素材ID</label>
                        <input class="operate" type="hidden" data-name="mid" value="LIKE %...%"/>
                        <div>
                            <input class="form-control" type="text" name="mid" placeholder="请输入素材ID" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">失败原因</label>
                        <input class="operate" type="hidden" data-name="reason" value="LIKE %...%"/>
                        <div>
                            <input class="form-control" type="text" name="reason" placeholder="请输入失败原因关键词" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">创建时间</label>
                        <input type="text" class="form-control datetimerange" name="create_time" data-name="create_time" data-operate="RANGE" placeholder="请选择创建时间范围">
                        <input type="hidden" class="operate" data-name="create_time" value="RANGE">
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div class="row">
                            <div class="col-xs-6">
                                <button type="submit" class="btn btn-success btn-block">搜索</button>
                            </div>
                            <div class="col-xs-6">
                                <button type="reset" class="btn btn-default btn-block">重置</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
