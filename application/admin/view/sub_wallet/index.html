<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">

                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                        <a href="javascript:;" class="btn btn-primary btn-changeteacher btn-disabled disabled" title="批量绑定" > 批量绑定(<span id="select_total">0</span>)</a>
                    </div>


                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"

                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row">

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">子钱包ID</label>
                        <!--隐式的operate操作符，必须携带一个class为operate隐藏的文本框,且它的data-name="字段",值为操作符-->
                        <input class="operate" type="hidden" data-name="sub_wallet_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="sub_wallet_id" placeholder="请输入查找的子钱包ID" value=""/>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3" style="min-height:68px;">
                    <!--这里添加68px是为了避免刷新时出现元素错位闪屏-->
                    <div class="form-group">
                        <label class="control-label">是否绑定用户</label>
                        <input type="hidden" class="operate" data-name="bind_store_id" value="="/>
                        <div>
                            <!--给select一个固定的高度-->
                            <!--@formatter:off-->
                            <select id="c-state" class="form-control selectpicker" name="bind_store_id" style="height:31px;">
                                <option value="" >ALL</option>
                                <option value="0" >未绑定</option>
                                <option value="1" >已绑定</option>
                            </select>
                            <!--@formatter:on-->
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3" style="min-height:68px;">
                    <!--这里添加68px是为了避免刷新时出现元素错位闪屏-->
                    <div class="form-group">
                        <label class="control-label">钱包类型</label>
                        <input type="hidden" class="operate" data-name="sub_wallet_type" value="="/>
                        <div>
                            <!--给select一个固定的高度-->
                            <!--@formatter:off-->
                            <select id="c-type" class="form-control selectpicker" name="sub_wallet_type" style="height:31px;">
                                <option value="" >ALL</option>
                                <option value="0" >未绑定</option>
                                <option value="1" >公账</option>
                                <option value="2" >私账</option>
                            </select>
                            <!--@formatter:on-->
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div class="row">
                            <div class="col-xs-6">
                                <input type="submit" class="btn btn-success btn-block" value="提交"/>
                            </div>
                            <div class="col-xs-6">
                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
