<form id="batch_binding-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">绑定账号:</label>
        <select  class="form-control selectpicker" name="store_id">
            <option value="">请选择</option>
            {foreach $storeList as $k => $v}
            <option value="{$v.id}">{$v.username}</option>
            {/foreach}
        </select>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">钱包类型:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label>
                    <input name="wallet_type"  type="radio" value="1" checked> 公账
                </label>
                <label>
                    <input name="wallet_type" type="radio" value="2" > 私账
                </label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="c-discount_percentage" class="control-label col-xs-12 col-sm-2">折扣比例:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-discount_percentage"  class="form-control" step="0.0001" value="0.0000" name="discount_percentage" type="number" placeholder="折扣比例" />
        </div>
    </div>


    <div class="form-group hidden layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
