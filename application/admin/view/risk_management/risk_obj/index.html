<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <input style="visibility: hidden;" id="adv_id" value="{$adv_id}">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar" style="display: flex;">
                        <a href="javascript:;" id="shuaxin" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:history.back();" style="margin-left: 10px"  class="btn btn-success btn-block"  >返回账户列表</a>
                        <a href="javascript:;" style="margin-left: 10px" class="btn btn-primary" >公司主体名称:{$company_name}</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script id="search-tpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row" style="width:60% ;display: flex;">
                <div class="col-xs-3 col-sm-2 col-md-3">
                    <div class="form-group">
                        <input type="hidden" class="operate" data-name="keyword" value="like"/>
                        <label class="control-label">敏感词</label>
                        <div>
                            <label>
                                <input class="form-control" type="text" name="keyword" value=""/>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="col-xs-3 col-sm-2 col-md-3">
                    <div class="form-group">
                        <input type="hidden" class="operate" data-name="obj_status" value="="/>
                        <label class="control-label">计划状态</label>
                        <select class="form-control selectpicker" name="obj_status" data-live-search="false">
                            {foreach $obj_status as $k => $v}
                            <option value="{$k}">{$v}</option>
                            {/foreach}
                        </select>
                    </div>
                </div>

                <div class="col-xs-3 col-sm-2 col-md-3">
                    <div class="form-group">
                        <input type="hidden" class="operate" data-name="sys_tag" value="="/>
                        <label class="control-label">标签</label>
                        <select class="form-control selectpicker" name="sys_tag" data-live-search="false">
                            <option value="">全部违规</option>
                            <option value="0">正常</option>
                            {foreach $tag_list as $k => $v}
                            <option value="{$k}">{$v}</option>
                            {/foreach}
                        </select>
                    </div>
                </div>

                <div class="col-xs-3 col-sm-2 col-md-3">
                    <div class="form-group">
                        <input type="hidden" class="operate" data-name="handle_status" value="="/>
                        <label class="control-label">处理状态</label>
                        <select class="form-control selectpicker" name="handle_status" data-live-search="false">
                            <option value="-1">全部</option>
                            {foreach $handle_status_list as $k => $v}
                            <option value="{$k}">{$v}</option>
                            {/foreach}
                        </select>
                    </div>
                </div>

                <div class="col-xs-6 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div class="row">
                            <div class="col-xs-6">
                                <input type="submit" class="btn btn-success btn-block" value="提交"/>
                            </div>
                            <div class="col-xs-6">
                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
