<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">

                <div class="widget-body no-padding">

                    <form id="edit-form" class="form-commonsearch" role="form" data-toggle="validator" method="POST" action="">

                        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
                            <!--<h4>自定义搜索表单</h4>-->
                            <hr>
                            <div class="row">
                                <div style="width: 100%;display: flex;">
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--<input type="hidden" class="operate" data-name="city" value="="/>-->
                                            <label class="control-label" style="color: red">客服数据库【先选择此框】</label>
                                            <div>
                                                <select data-live-search="true" name="status" id="cs" class="form-control selectpicker">
                                                    <option value="" >请选择</option>
                                                    <option value="cxy" >陈秀玉</option>
                                                    <option value="tyx" >谭玉霞</option>
                                                    <option value="wyc" >王倚澄</option>
                                                    <option value="zqp" >张秋萍</option>
                                                    <option value="mmc" >莫美春</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div style="width: 100%;display: flex;">
                                    <div class="col-xs-4 col-sm-4 col-md-4">
                                        <div class="form-group">
                                            <label class="control-label">日期筛选</label>
                                            <div>
                                                <input type="text"  class="form-control datetimerange" id="dateRange" data-locale='{"format":"YYYY-MM-DD"}' placeholder="指定日期" value="" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
<!--                                            <input type="hidden" class="operate" data-name="status" value="="/>-->
                                            <label class="control-label">状态</label>
                                            <div>
                                                <select data-live-search="true" name="status" id="status" class="form-control selectpicker">
                                                    <option value="" >ALL</option>
                                                    <option value="0" selected>等待中</option>
                                                    <option value="1" >已完成</option>
                                                    <option value="2" >失败</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--                                            <input type="hidden" class="operate" data-name="status" value="="/>-->
                                            <label class="control-label">脚本类型</label>
                                            <div>
                                                <select data-live-search="false" name="code_type" id="code_type" class="form-control selectpicker">

                                                    <option value="0" selected>标准追次数</option>
                                                    <option value="1" >标准平均</option>
                                                    <option value="2" >标准元素</option>
                                                    <option value="3" >全域追次数</option>
                                                    <option value="4" >全域平均</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">千川id</label>
                                            <div>
                                                <input type="text" class="form-control" name="adv_id" id="adv_id" placeholder="请输入千川id" value=""/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">任务名称</label>
                                            <div>
                                                <input type="text" class="form-control" name="job_name" id="job_name" placeholder="请输入任务名称" value=""/>
                                            </div>
                                        </div>
                                    </div>


                                </div>

                                <div class="col-xs-6 col-sm-6 col-md-3">
                                    <div class="form-group">
                                        <label class="control-label"></label>
                                        <div class="row">
                                            <div class="col-xs-3">
                                                <input type="button"  id="tj"  class="btn btn-success btn-block" value="提交"/>
                                            </div>
                                            <div class="col-xs-3">
                                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" id="shuaxin" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                    </div>


                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"

                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="text/javascript">
    // 获取当前日期
    const today = new Date();

    // 当天日期（无需计算差值）
    const startDate = new Date(today); // 直接使用当天作为开始日期

    // 格式化日期为"YYYY-MM-DD"
    const formattedToday = today.toISOString().split('T')[0];
    const formattedStartDate = startDate.toISOString().split('T')[0];

    // 设置输入框默认值为当天
    document.getElementById('dateRange').value = `${formattedToday}`; // 或 `${formattedToday} - ${formattedToday}` 若需要范围格式

    // 保留原有点击事件
    document.getElementById('tj').addEventListener('click', function(event) {
        document.getElementById('shuaxin').click()
    })
</script>
