
<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}

    <input type="hidden" name="ids" class="form-control company-ids" value="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">白名单:</label>
        <div class="col-xs-12 col-sm-4">
            <div class="radio">
                <label>
                    <input name="is_white"  type="radio" value="0"  > 是
                </label>
                <label>
                    <input name="is_white" type="radio" value="1" > 否
                </label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="c-percentage" class="control-label col-xs-12 col-sm-2">百分比:</label>
        <div class="col-xs-4 col-sm-4">
            <input id="c-percentage" class="form-control" name="percentage" type="number"  placeholder="请输入百分比如：80"  value="10"/>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>

</form>
