<form id="add-form" class="form-horizontal" role="form" method="POST" action="{:url('subject/add')}">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">主体名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="name" value="" placeholder="请输入主体名称" required>
        </div>
    </div>
    <div class="form-group layer-footer">
        <div class="col-xs-12 col-sm-8 col-sm-offset-2">
            <button type="submit" class="btn btn-success btn-embossed">提交</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
