<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="id" value="{$row.id}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" style="font-weight: 600; color: #495057;">绑定账号:</label>
        <div class="col-xs-12 col-sm-4">
            {$storeList}
        </div>
    </div>
    
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" style="font-weight: 600; color: #495057;">权限:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="checkbox-container" style="background: #f8f9fa; border-radius: 8px; padding: 20px; border: 1px solid #e9ecef; box-shadow: 0 2px 4px rgba(0,0,0,.05);">
                {foreach $power_options as $value => $label}
                <label class="checkbox-inline" style="display: inline-block; margin-right: 15px; margin-bottom: 12px; font-weight: normal; padding: 10px 15px; border-radius: 6px; background: white; border: 1px solid #dee2e6; transition: all 0.3s ease; cursor: pointer;">
                    <input type="checkbox" name="power[]" value="{$value}" 
                        {if isset($row.power) && in_array($value, explode(',', $row.power))}checked{/if}
                        style="margin-right: 8px; transform: scale(1.3); accent-color: #007bff;">
                    <span style="font-size: 14px; vertical-align: middle;">{$label}</span>
                </label>
                {/foreach}
            </div>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled" style="padding: 12px 35px; font-size: 16px; border-radius: 6px; background: #007bff; border: none; transition: all 0.3s;">
                {:__('OK')}
            </button>
            <button type="reset" class="btn btn-default btn-embossed" style="padding: 12px 35px; font-size: 16px; margin-left: 15px; border-radius: 6px; background: #6c757d; color: white; border: none; transition: all 0.3s;">
                {:__('Reset')}
            </button>
        </div>
    </div>
</form>

<script>
    // 添加悬停效果
    document.addEventListener('DOMContentLoaded', function() {
        var checkboxes = document.querySelectorAll('.checkbox-inline');
        checkboxes.forEach(function(checkbox) {
            checkbox.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = '0 4px 8px rgba(0,0,0,.1)';
            });
            
            checkbox.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = 'none';
            });
        });
    });
</script>
