<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">

                <div class="widget-body no-padding">

                    <form id="edit-form" class="form-commonsearch" role="form" data-toggle="validator" method="POST" action="">

                        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
                            <!--<h4>自定义搜索表单</h4>-->
                            <hr>
                            <div class="row">
                                <div style="width: 100%;display: flex;">
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--<input type="hidden" class="operate" data-name="account_id" value="="/>-->
                                            <label class="control-label">千川id</label>
                                            <div>
                                                <select data-live-search="true" name="account_id" id="account_id" class="form-control selectpicker">
                                                    <option value="{$account_data.0.advertiser_id}" selected="selected">{$account_data.0.advertiser_id}</option>
                                                    {foreach $account_data  as $vo}
                                                    <option value="{$vo.advertiser_id}">{$vo.advertiser_id}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--<input type="hidden" class="operate" data-name="marketing_goal" value="="/>-->
                                            <label class="control-label" >推广类型</label>
                                            <div>
                                                <select data-live-search="false" name="marketing_goal" id="marketing_goal" class="form-control selectpicker">
                                                    <option value="" >请选择</option>
                                                    <option value="LIVE_PROM_GOODS" >推直播间</option>
                                                    <option value="VIDEO_PROM_GOODS" selected >推商品</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--<input type="hidden" class="operate" data-name="marketing_goal" value="="/>-->
                                            <label class="control-label" >广告类型</label>
                                            <div>
                                                <select data-live-search="false" name="marketing_scene" id="marketing_scene" class="form-control selectpicker">
                                                    <option value="" >请选择</option>
                                                    <option value="FEED" selected >通投</option>
                                                    <option value="SEARCH" >搜索</option>
                                                    <option value="SHOPPING_MALL" >商城广告</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                            <div class="row">
                                <div style="width: 100%;display: flex;">
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">日期筛选</label>
                                            <div>
                                                <input type="text"  class="form-control datetimerange" id="dateRange" data-locale='{"format":"YYYY-MM-DD"}' placeholder="指定日期" value="" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
<!--                                            <input type="hidden" class="operate" data-name="status" value="="/>-->
                                            <label class="control-label">素材建议</label>
                                            <div>
                                                <select data-live-search="false" name="analysis_type" id="analysis_type" class="form-control selectpicker">
                                                    <option value="CARRY_MATERIAL" selected>搬运风险素材</option>
                                                    <option value="LOW_EFFICIENCY_MATERIAL" >低效素材</option>
                                                    <option value="FIRST_PUBLISH_MATERIAL" >首发素材</option>
                                                    <option value="SIMILAR_RISK_MATERIAL" >同质化素材</option>
                                                    <option value="HIGH_QUALITY_MATERIAL" selected >优质素材</option>
                                                    <option value="POOR_QUALITY_MATERIAL" >低质素材</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--<input type="hidden" class="operate" data-name="marketing_goal" value="="/>-->
                                            <label class="control-label" >素材类型</label>
                                            <div>
                                                <select data-live-search="false" name="material_type" id="material_type" class="form-control selectpicker">
                                                    <option value="" >请选择</option>
                                                    <option value="IMAGE" >图文</option>
                                                    <option value="LIVE_ROOM" >直播间画面</option>
                                                    <option value="TITLE" >标题</option>
                                                    <option value="VIDEO"  selected>视频</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="col-xs-6 col-sm-6 col-md-3">
                                    <div class="form-group">
                                        <label class="control-label"></label>
                                        <div class="row">
                                            <div class="col-xs-3">
                                                <input type="button"  id="tj"  class="btn btn-success btn-block" value="提交"/>
                                            </div>
                                            <div class="col-xs-3">
                                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" id="shuaxin" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                    </div>


                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"

                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="text/javascript">
    // 获取当前日期
    const today = new Date();

    // 当天日期（无需计算差值）
    const startDate = new Date(today); // 直接使用当天作为开始日期

    // 格式化日期为"YYYY-MM-DD"
    const formattedToday = today.toISOString().split('T')[0];
    const formattedStartDate = startDate.toISOString().split('T')[0];

    // 设置输入框默认值为当天
    document.getElementById('dateRange').value = `${formattedToday}`; // 或 `${formattedToday} - ${formattedToday}` 若需要范围格式

    // 保留原有点击事件
    document.getElementById('tj').addEventListener('click', function(event) {
        document.getElementById('shuaxin').click()
    })
</script>
