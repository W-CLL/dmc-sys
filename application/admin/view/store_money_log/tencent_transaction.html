<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <ul class="nav nav-tabs modern-tabs" role="tablist">
            <li role="presentation">
                <a href="{:url('store_money_log/index')}" id="index-tab">千川流水</a>
            </li>
            <li role="presentation" class="active">
                <a href="#tencent" id="tencent-tab" role="tab" data-toggle="tab" aria-controls="tencent">腾讯流水</a>
            </li>
        </ul>
        
        <div id="myTabContent" class="tab-content" style="margin-top: 20px;">
            <div class="tab-pane fade active in" id="tencent">
                <div class="widget-body no-padding">
                    <form id="tencent-form" class="form-commonsearch" role="form" data-toggle="validator" method="POST" action="">
                        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
                            <hr>
                            <div class="row">
                                <div style="width: 100%;display: flex;">
                                    <div class="col-xs-4 col-sm-4 col-md-4">
                                        <div class="form-group">
                                            <label class="control-label">日期筛选</label>
                                            <div>
                                                <input type="text" class="form-control datetimerange" id="tencentDateRange" data-locale='{"format":"YYYY-MM-DD"}' placeholder="指定日期" value="" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">腾讯子客id</label>
                                            <div>
                                                <select data-live-search="true" name="account_id" id="tencentAccountId" class="form-control selectpicker">
                                                    <option value="0" selected="selected">无</option>
                                                    {foreach $account_data as $vo}
                                                    <option value="{$vo.account_id}">{$vo.account_id}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">腾讯子钱包id</label>
                                            <div>
                                                <select data-live-search="true" name="sub_wallet_id" id="tencentSubWalletId" class="form-control selectpicker">
                                                    <option value="0" selected="selected">无</option>
                                                    {foreach $account_wallet_data as $vo}
                                                    <option value="{$vo.sub_wallet_id}">{$vo.sub_wallet_id}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">绑定的用户</label>
                                            <div>
                                                <select data-live-search="true" name="store_id" id="tencentStoreId" class="form-control selectpicker">
                                                    <option value="0" selected="selected">无</option>
                                                    {foreach $store_data as $vo}
                                                    <option value="{$vo.id}">{$vo.username}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">服务商筛选</label>
                                            <div>
                                                <select name="agency" id="tencentAgency" class="form-control selectpicker">
                                                    <option value="0" selected="selected">全部</option>
                                                    <option value="1">浣熊(64568612)</option>
                                                    <option value="2">斑马(74230866)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">类型筛选</label>
                                            <div>
                                                <select name="type" id="tencentType" class="form-control selectpicker">
                                                    <option value="0" selected="selected">全部</option>
                                                    <option value="4">子客账户流水</option>
                                                    <option value="8">共享钱包流水</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-12 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <label class="control-label">金额</label>
                                            <div>
                                                <input class="form-control" id="tencentMoney" type="text" name="money" placeholder="请输入金额" value=""/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-6 col-sm-6 col-md-3">
                                    <div class="form-group">
                                        <label class="control-label"></label>
                                        <div class="row">
                                            <div class="col-xs-3">
                                                <input type="button" id="tencentSubmit" class="btn btn-success btn-block" value="提交"/>
                                            </div>
                                            <div class="col-xs-3">
                                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="tencentToolbar" class="toolbar">
                        <a href="javascript:;" id="tencentRefresh" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                    </div>

                    <table id="tencentTable" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .modern-tabs {
        display: flex;
        border: none;
        background: transparent;
        padding: 0;
        margin-bottom: 15px;
        position: relative;
    }
    
    .modern-tabs:before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: #ebedf2;
        z-index: 1;
    }
    
    .modern-tabs > li {
        margin-bottom: 0;
        position: relative;
    }
    
    .modern-tabs > li > a {
        border: none;
        border-radius: 6px 6px 0 0;
        color: #6c757d;
        font-weight: 500;
        padding: 12px 24px;
        margin-right: 5px;
        background: #f8f9fa;
        transition: all 0.3s ease;
        position: relative;
        z-index: 2;
    }
    
    .modern-tabs > li > a:hover {
        color: #495057;
        background: #e9ecef;
    }
    
    .modern-tabs > li.active > a,
    .modern-tabs > li.active > a:hover,
    .modern-tabs > li.active > a:focus {
        color: #fff;
        background: #007bff;
        border: none;
        box-shadow: 0 2px 4px rgba(0, 123, 255, 0.2);
    }
    
    .modern-tabs > li:not(.active) > a {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
</style>

<script type="text/javascript">
    // 获取当前日期
    const today = new Date();

    // 计算30天前的日期
    const sevenDaysAgo = new Date(today);
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 30);

    // 格式化日期为"YYYY-MM-DD"格式
    const formattedToday = today.toISOString().split('T')[0];
    const formattedSevenDaysAgo = sevenDaysAgo.toISOString().split('T')[0];

    // 设置输入框的默认值
    document.getElementById('tencentDateRange').value = `${formattedSevenDaysAgo} - ${formattedToday}`;
    document.getElementById('tencentSubmit').addEventListener('click', function(event) {
        document.getElementById('tencentRefresh').click()
    })
</script>
