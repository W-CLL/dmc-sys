<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">业务员(录单):</label>
        <div class="col-xs-12 col-sm-4">
            {$adminList}
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Group')}:</label>
        <div class="col-xs-12 col-sm-4">
            {$groupList}
        </div>
    </div>
<!--    <div class="form-group">-->
<!--        <label class="control-label col-xs-12 col-sm-2">销售员:</label>-->
<!--        <div class="col-xs-12 col-sm-4">-->

<!--        </div>-->
<!--    </div>-->
    <div class="form-group">
        <label for="c-username" class="control-label col-xs-12 col-sm-2">账号:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-username"  class="form-control" data-rule="required" name="username" type="text" value=""  />
        </div>
    </div>
    <div class="form-group">
        <label for="c-password" class="control-label col-xs-12 col-sm-2">{:__('Password')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-password" data-rule="password" class="form-control" name="password" type="password" value="" placeholder="(默认密码为123456)" autocomplete="new-password" />
        </div>
    </div>

    <div class="form-group">
        <label for="c-public_credit_limit" class="control-label col-xs-12 col-sm-2">授信额度(公):</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-public_credit_limit"  class="form-control" name="public_credit_limit" type="number" value="0" placeholder="授信额度(公)" />
        </div>
    </div>

    <div class="form-group">
        <label for="c-private_credit_limit" class="control-label col-xs-12 col-sm-2">授信额度(私):</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-private_credit_limit"  class="form-control" name="private_credit_limit" type="number" value="0" placeholder="授信额度(私)" />
        </div>
    </div>

    <div class="form-group">
        <label for="c-public_discount_percentage" class="control-label col-xs-12 col-sm-2">折扣比例(公):</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-public_discount_percentage"  class="form-control" name="public_discount_percentage" type="number" value="0" placeholder="折扣比例(公)" />
        </div>
    </div>

    <div class="form-group">
        <label for="c-private_discount_percentage" class="control-label col-xs-12 col-sm-2">折扣比例(私):</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-private_discount_percentage"  class="form-control" name="private_discount_percentage" type="number" value="0" placeholder="折扣比例(私)" />
        </div>
    </div>


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label>
                    <input name="status"  type="radio" value="0"> 禁用
                </label>
                <label>
                    <input name="status" checked type="radio" value="1"> 正常
                </label>
            </div>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
