<meta charset="UTF-8">
<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">绑定账号:</label>
        <div class="col-xs-12 col-sm-4">
            {$storeList}
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">账户类型:</label>
        <div class="col-xs-12 col-sm-4">
            <select data-rule="required" class="form-control selectpicker" name="row[account_type]">
                <option value="1" <?php if($row['account_type'] == 1): ?>selected<?php endif; ?>>公账</option>
                <option value="2" <?php if($row['account_type'] == 2): ?>selected<?php endif; ?>>私账</option>
            </select>
        </div>
    </div>
    
    <div class="form-group">
        <label for="c-discount_percentage" class="control-label col-xs-12 col-sm-2">折扣比例:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-discount_percentage" class="form-control" name="row[discount_percentage]" type="number" value="{$row.discount_percentage}" step="0.0001" placeholder="折扣比例" />
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>

        </div>
    </div>
</form>
