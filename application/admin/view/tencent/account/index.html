<meta charset="UTF-8">
<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                        <a href="javascript:;" class="btn btn-primary btn-changeteacher btn-disabled disabled" title="批量绑定" > 批量绑定(<span id="select_total">0</span>)</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('tencent/account/edit')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row">
                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">账户ID</label>
                        <input class="operate" type="hidden" data-name="account_id" value="="/>
                        <div>
                            <input class="form-control" type="text" name="account_id" placeholder="请输入账户ID" value=""/>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">账户名称</label>
                        <input class="operate" type="hidden" data-name="name" value="like"/>
                        <div>
                            <input class="form-control" type="text" name="name" placeholder="请输入账户名称" value=""/>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">绑定用户</label>
                        <input class="operate" type="hidden" data-name="store.username" value="like"/>
                        <div>
                            <input class="form-control" type="text" name="store.username" placeholder="请输入绑定用户名" value=""/>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">账户状态</label>
                        <div>
                            <select data-rule="required" class="form-control selectpicker" name="status">
                                <option value="">请选择</option>
                                <option value="1">有效</option>
                                <option value="4">封禁</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div class="row">
                            <div class="col-xs-6">
                                <input type="submit" class="btn btn-success btn-block" value="提交"/>
                            </div>
                            <div class="col-xs-6">
                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
