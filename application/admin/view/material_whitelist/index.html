<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('material_whitelist/add')?'':'hide'}" title="{:__('Add')}" ><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-info btn-batch-add {:$auth->check('material_whitelist/batch_add')?'':'hide'}" title="批量添加" ><i class="fa fa-plus-circle"></i> 批量添加</a>
                        <a href="javascript:;" class="btn btn-success btn-multi btn-disabled disabled {:$auth->check('material_whitelist/multi')?'':'hide'}" data-params="action=enable" title="启用" ><i class="fa fa-eye"></i> 启用</a>
                        <a href="javascript:;" class="btn btn-warning btn-multi btn-disabled disabled {:$auth->check('material_whitelist/multi')?'':'hide'}" data-params="action=disable" title="禁用" ><i class="fa fa-eye-slash"></i> 禁用</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('material_whitelist/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>

                        <div class="dropdown btn-group {:$auth->check('material_whitelist/multi')?'':'hide'}">
                            <a class="btn btn-primary btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-cog"></i> {:__('More')}</a>
                            <ul class="dropdown-menu text-left" role="menu">
                                <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:;" data-params="action=enable"><i class="fa fa-eye"></i> 启用</a></li>
                                <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:;" data-params="action=disable"><i class="fa fa-eye-slash"></i> 禁用</a></li>
                            </ul>
                        </div>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('material_whitelist/edit')}"
                           data-operate-del="{:$auth->check('material_whitelist/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
