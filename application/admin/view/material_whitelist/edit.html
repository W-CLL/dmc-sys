<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">过滤类型:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
            {volist name="filterTypeList" id="vo"}
                <label for="row[filter_type]-{$key}">
                    <input id="row[filter_type]-{$key}" name="row[filter_type]" type="radio" value="{$key}" {in name="key" value="$row.filter_type"}checked{/in} onchange="toggleFilterFields()" /> {$vo}
                </label>
            {/volist}
            </div>
            <span class="help-block">公司级别：过滤该公司下所有广告主；广告主级别：只过滤指定广告主</span>
        </div>
    </div>

    <div class="form-group" id="company-field">
        <label class="control-label col-xs-12 col-sm-2">公司名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-company_name" class="form-control" name="row[company_name]" type="text" value="{$row.company_name|htmlentities}" placeholder="请输入公司名称">
            <span class="help-block">选择公司级别时必填</span>
        </div>
    </div>

    <div class="form-group" id="adv-field" style="display: none;">
        <label class="control-label col-xs-12 col-sm-2">广告主ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-adv_id" class="form-control" name="row[adv_id]" type="text" value="{$row.adv_id|htmlentities}" placeholder="请输入广告主ID">
            <span class="help-block">选择广告主级别时必填</span>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
            {volist name="statusList" id="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
            {/volist}
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" class="form-control" name="row[remark]" type="text" value="{$row.remark|htmlentities}" placeholder="备注说明（可选）">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
// 切换过滤类型时显示/隐藏相应字段
function toggleFilterFields() {
    var filterType = $('input[name="row[filter_type]"]:checked').val();
    var companyField = $('#company-field');
    var advField = $('#adv-field');
    var companyInput = $('#c-company_name');
    var advInput = $('#c-adv_id');

    if (filterType == '1') {
        // 公司级别
        companyField.show();
        advField.hide();
        companyInput.attr('data-rule', 'required');
        advInput.removeAttr('data-rule');
    } else {
        // 广告主级别
        companyField.hide();
        advField.show();
        advInput.attr('data-rule', 'required');
        companyInput.removeAttr('data-rule');
    }
}

// 页面加载时初始化
$(document).ready(function() {
    toggleFilterFields();
});
</script>
