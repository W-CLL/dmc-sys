<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,add,del')}
                        <button type="button" class="btn btn-warning" id="btn-execute">
                            <i class="fa fa-play"></i> 执行
                        </button>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script id="customformtpl" type="text/html">
    <form action="" class="form-commonsearch">
        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
            <div class="row">

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">主体名</label>
                        <input class="operate" type="hidden" data-name="subject_name" value="like"/>
                        <div>
                            <input class="form-control" type="text" name="subject_name" placeholder="请输入主体名" value=""/>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">状态</label>
                        <div>
                            <select id="status" data-rule="required" class="form-control selectpicker" name="status">
                                <option name="status" value="" ></option>
                                <option name="status" value="0">待执行</option>
                                <option name="status" value="1">完成</option>
                                <option name="status" value="2">失败</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label">主体类型</label>
                        <div>
                            <select id="subject_type" data-rule="required" class="form-control selectpicker" name="subject_type">
                                <option name="subject_type" value="" ></option>
                                <option name="subject_type" value="0">公</option>
                                <option name="subject_type" value="1">私</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-6 col-md-3">
                    <div class="form-group">
                        <label class="control-label"></label>
                        <div class="row">
                            <div class="col-xs-6">
                                <input type="submit" class="btn btn-success btn-block" value="提交"/>
                            </div>
                            <div class="col-xs-6">
                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</script>
