<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">查询开始日期:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-start_time"   class="form-control" name="start_time" type="date" />
            <span class="help-block">可选日期范围是今天以前<br>（不允许包括今天）</span>
        </div>

    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">查询结束日期:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-end_time"  class="form-control" name="end_time" type="date" />
            <span class="help-block">可选日期范围是今天以前<br>开始与结束跨度不能超过365天</span>
        </div>
    </div>


    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
