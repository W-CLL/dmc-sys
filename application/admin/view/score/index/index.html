<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <form id="edit-form" class="form-commonsearch" role="form" data-toggle="validator" method="POST" action="score/index/index">
                        <div style="border-radius:2px;margin-bottom:10px;background:#f5f5f5;padding:15px 20px;">
                            <div class="row">
                                    <div class="col-xs-3 col-sm-3 col-md-3">
                                        <div class="form-group">
                                            <!--<input type="hidden" class="operate" data-name="account_id" value="="/>-->
                                            <label class="control-label">千川id</label>
                                            <div>
                                                <select data-live-search="true" name="account_id" id="account_id" class="form-control selectpicker">
                                                    <option value="0" selected="selected">无</option>
                                                    {foreach $account_data  as $vo}
                                                    <option value="{$vo.adv_id}">{$vo.adv_id}</option>
                                                    {/foreach}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                <div class="col-xs-3 col-sm-3 col-md-3">
                                    <div class="form-group">
                                        <!--<input type="hidden" class="operate" data-name="com_name" value="="/>-->
                                        <label class="control-label">公司名称</label>
                                        <div>
                                            <label for="com_name"></label><input type="text" class="form-control" name="com_name" id="com_name" placeholder="请输入公司名" value=""/>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-xs-3 col-sm-3 col-md-3">
                                    <div class="form-group">
                                        <!--<input type="hidden" class="operate" data-name="kahuna" value="="/>-->
                                        <label class="control-label">负责人</label>
                                        <div>
                                            <label for="kahuna"></label><input type="text" class="form-control" name="kahuna" id="kahuna" placeholder="请输入负责人" value=""/>
                                        </div>
                                    </div>
                                </div>


                                <div class="col-xs-6 col-sm-6 col-md-3">
                                    <div class="form-group">
                                        <label class="control-label"></label>
                                        <div class="row">
                                            <div class="col-xs-3">
                                                <input type="button"  id="tj1"  class="btn btn-success btn-block" value="提交"/>
                                            </div>
                                            <div class="col-xs-3">
                                                <input type="reset" class="btn btn-primary btn-block" value="重置"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" id="shuaxin" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                    </div>
                    <table id="index-table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
